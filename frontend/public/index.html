        <script>
          /* Kill-switch: detects reload loops caused by service-worker
             `controllerchange` cycles. If the page has reloaded more than
             3 times in the last 15 seconds, unregister ALL service workers
             and clear their caches so the loop breaks. Inlined here so it
             ships in every HTML fetch (network-first) regardless of cache. */
          (function() {
            try {
              var KEY = 'ir-reload-monitor';
              var now = Date.now();
              var raw = sessionStorage.getItem(KEY);
              var arr = raw ? JSON.parse(raw) : [];
              arr = arr.filter(function(t) { return now - t < 15000; });
              arr.push(now);
              sessionStorage.setItem(KEY, JSON.stringify(arr));
              if (arr.length > 3 && navigator.serviceWorker) {
                console.warn('[IR] Reload loop detected (' + arr.length + ' in 15s) — unregistering SW.');
                sessionStorage.removeItem(KEY);
                sessionStorage.setItem('ir-loop-broken', '1');
                // Stop the current page from continuing to load stale JS/CSS.
                if (window.stop) window.stop();
                Promise.resolve()
                  .then(function() {
                    return navigator.serviceWorker.getRegistrations().then(function(regs) {
                      return Promise.all(regs.map(function(r) { return r.unregister(); }));
                    });
                  })
                  .then(function() {
                    if (!window.caches) return null;
                    return caches.keys().then(function(names) {
                      return Promise.all(names.map(function(n) { return caches.delete(n); }));
                    });
                  })
                  .then(function() {
                    window.location.replace(window.location.pathname + '?_recovery=' + now);
                  })
                  .catch(function() {
                    window.location.replace(window.location.pathname + '?_recovery=' + now);
                  });
              }
            } catch (e) { /* sessionStorage disabled — skip monitor */ }
          })();
        </script>
